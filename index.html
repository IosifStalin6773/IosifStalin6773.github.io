<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUPER PORTFOLIO BROS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
</head>

<body data-screen="boot">

    <!-- ============ ESCENA MARIO ============ -->
    <div class="scene">

        <!-- Nubes -->
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="cloud c4"></div>

        <!-- Suelo inferior -->
        <div class="ground"></div>
        <div class="bushes">
            <span class="bush b1"></span>
            <span class="bush b2"></span>
            <span class="bush b3"></span>
        </div>

        <!-- HUD superior estilo Mario -->
        <header class="hud" id="hud">
            <span class="hud-item"> <b id="hud-name">---</b></span>
            <span class="hud-item">×<b id="hud-coins">00</b> <span class="coin-icon">◉</span></span>
            <span class="hud-item">WORLD <b id="hud-world">1-1</b></span>
            <span class="hud-item">TIME <b id="hud-time">400</b></span>
        </header>

        <!-- ========== BOOT ========== -->
        <section class="screen active" id="screen-boot">
            <div class="boot-box">
                <div class="boot" id="boot-log"></div>
            </div>
        </section>

        <!-- ========== TITLE ========== -->
        <section class="screen" id="screen-title">
            <div class="title-wrap">
                <p class="tiny">★ 1 PLAYER GAME ★</p>
                <h1 class="big-title" id="title-name">SUPER<br>PORTFOLIO<br>BROS</h1>
                <p class="subtitle" id="title-role">DEV · ADVENTURE</p>

                <div class="press-block">
                    <div class="qblock">?</div>
                    <p class="blink" id="press-start">PULSA START</p>
                </div>

                <p class="tiny dim" id="title-copy">© 1987 TU-EMPRESA SOFT</p>
            </div>
        </section>

        <!-- ========== MENU ========== -->
        <section class="screen" id="screen-menu">
            <h2 class="screen-title">▸ SELECCIONA MUNDO</h2>
            <ul class="menu" id="menu-list"></ul>
            <p class="hint">↑↓ MOVER &nbsp;·&nbsp; ENTER ENTRAR &nbsp;·&nbsp; M SONIDO</p>
        </section>

        <!-- ========== LEVEL ========== -->
        <section class="screen" id="screen-level">
            <div class="level-header">
                <span class="pipe-mini"></span>
                <span id="level-code">WORLD 1-1</span>
                <span id="level-name">---</span>
                <span class="pipe-mini pipe-mini-r"></span>
            </div>
            <div class="level-body" id="level-content"></div>
            <p class="hint"><b id="back-btn">◀ VOLVER AL MAPA</b> &nbsp;(ESC)</p>
        </section>
        <!-- ========== CERT DETAIL ========== -->
        <section class="screen" id="screen-cert">
            <div class="level-header">
                <span class="pipe-mini"></span>
                <span id="cert-code">BADGE</span>
                <span id="cert-issuer">CISCO</span>
                <span class="pipe-mini pipe-mini-r"></span>
            </div>
            <div class="level-body" id="cert-content"></div>
            <p class="hint"><b id="cert-back-btn">◀ VOLVER A CERTIFICACIONES</b> &nbsp;(ESC)</p>
        </section>
        <!-- Botón de sonido -->
        <button class="sound-btn" id="sound-btn" title="Silenciar (M)">♪ ON</button>

    </div>

    <script src="script.js"></script>
</body>

</html>
